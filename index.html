<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c19">
  <title>Prisme 3D — Rouge et bleu</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090c19;
      color: #f7f8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 5%, #69234266, transparent 35%),
        radial-gradient(circle at 90% 25%, #116b8066, transparent 35%),
        #090c19;
    }

    main {
      width: min(100%, 760px);
      margin: auto;
      padding: 24px 16px 48px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(34px, 10vw, 58px);
      letter-spacing: -0.06em;
    }

    h1 span {
      color: #ff304f;
      text-shadow: 3px 0 #246dff;
    }

    p {
      color: #bbc2d8;
      line-height: 1.5;
    }

    .panel {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid #ffffff20;
      border-radius: 18px;
      background: #111629e8;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
      font-weight: 650;
    }

    input, select, button {
      width: 100%;
      font: inherit;
    }

    input[type="file"], select, button {
      min-height: 42px;
      padding: 10px;
      border: 1px solid #ffffff25;
      border-radius: 10px;
      background: #090d1b;
      color: #fff;
    }

    input[type="range"] {
      accent-color: #ff4262;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 14px;
      color: #e7eaf5;
      font-size: 13px;
    }

    .check input {
      width: auto;
      accent-color: #ff4262;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      background: #202943;
    }

    button.primary {
      border: 0;
      background: linear-gradient(110deg, #f02d57, #315fff);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .preview {
      overflow: hidden;
      margin-top: 16px;
      border: 1px solid #ffffff20;
      border-radius: 14px;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      color: #aeb8d2;
      font-size: 13px;
    }

    .hint {
      font-size: 12px;
      color: #929bb5;
    }
  </style>
</head>

<body>
<main>
  <h1>Prisme <span>3D</span></h1>
  <p>Charge une vidéo, règle le relief, puis regarde l’aperçu avec tes lunettes rouge et bleu.</p>

  <section class="panel">
    <label for="videoFile">Choisir une vidéo</label>
    <input id="videoFile" type="file" accept="video/*">

    <label for="depthRange">
      Intensité 3D : <span id="depthValue">0.0 %</span>
    </label>
    <input id="depthRange" type="range" min="0" max="3" step="0.1" value="0">

    <label for="resolution">Résolution d’export</label>
    <select id="resolution">
      <option value="480">Jusqu’à 480p</option>
      <option value="720">Jusqu’à 720p</option>
      <option value="1080" selected>Jusqu’à 1080p</option>
      <option value="source">Résolution originale</option>
    </select>

    <label for="frameRate">Fréquence d’images</label>
    <select id="frameRate">
      <option value="24">24 images/s</option>
      <option value="30" selected>30 images/s</option>
      <option value="60">60 images/s</option>
    </select>

    <label for="bitrate">Débit vidéo demandé</label>
    <select id="bitrate">
      <option value="4000000">4 Mb/s</option>
      <option value="8000000" selected>8 Mb/s</option>
      <option value="12000000">12 Mb/s</option>
      <option value="20000000">20 Mb/s</option>
    </select>

    <label class="check">
      <input id="swapViews" type="checkbox">
      Inverser les vues gauche/droite si le relief paraît inversé
    </label>

    <div class="buttons">
      <button id="playButton" type="button" disabled>▶ Lire / pause</button>
      <button id="exportButton" class="primary" type="button" disabled>
        Enregistrer la vidéo
      </button>
    </div>

    <div class="preview">
      <canvas id="canvas" width="640" height="360"></canvas>
    </div>

    <div id="status" class="status">Choisis une vidéo pour commencer.</div>
    <p class="hint">
      L’export est enregistré au format vidéo WebM si ton navigateur le prend en charge.
      Le son de la vidéo originale n’est pas inclus.
    </p>
  </section>
</main>

<video id="video" playsinline preload="auto" hidden></video>

<script>
(() => {
  const fileInput = document.getElementById("videoFile");
  const depthRange = document.getElementById("depthRange");
  const depthValue = document.getElementById("depthValue");
  const resolutionSelect = document.getElementById("resolution");
  const frameRateSelect = document.getElementById("frameRate");
  const bitrateSelect = document.getElementById("bitrate");
  const swapViews = document.getElementById("swapViews");
  const playButton = document.getElementById("playButton");
  const exportButton = document.getElementById("exportButton");
  const status = document.getElementById("status");
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  const redCanvas = document.createElement("canvas");
  const blueCanvas = document.createElement("canvas");
  const redCtx = redCanvas.getContext("2d", { willReadFrequently: true });
  const blueCtx = blueCanvas.getContext("2d", { willReadFrequently: true });

  let videoURL = null;
  let animationFrame = 0;
  let recording = false;

  function say(message) {
    status.textContent = message;
  }

  function getOutputSize() {
    const sourceWidth = video.videoWidth || 640;
    const sourceHeight = video.videoHeight || 360;
    const setting = resolutionSelect.value;

    if (setting === "source") {
      return { width: sourceWidth, height: sourceHeight };
    }

    const maxHeight = Number(setting);
    const scale = Math.min(1, maxHeight / sourceHeight);

    return {
      width: Math.max(2, Math.round(sourceWidth * scale)),
      height: Math.max(2, Math.round(sourceHeight * scale))
    };
  }

  function setCanvasSize() {
    const size = getOutputSize();

    if (canvas.width !== size.width || canvas.height !== size.height) {
      canvas.width = size.width;
      canvas.height = size.height;
    }

    for (const offscreen of [redCanvas, blueCanvas]) {
      if (offscreen.width !== size.width || offscreen.height !== size.height) {
        offscreen.width = size.width;
        offscreen.height = size.height;
      }
    }
  }

  function drawFrame() {
    if (!ctx) return;

    if (!video.videoWidth || video.readyState < 2) {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#c5cbe0";
      ctx.font = "16px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Choisis une vidéo pour afficher l’aperçu",
        canvas.width / 2, canvas.height / 2);
      return;
    }

    setCanvasSize();

    const width = canvas.width;
    const height = canvas.height;

    // L’intensité règle le décalage entre les deux vues.
    const intensity = Number(depthRange.value);
    const shift = Math.round(width * intensity / 1000);
    const reversed = swapViews.checked;

    const redShift = reversed ? shift : -shift;
    const blueShift = reversed ? -shift : shift;

    // Vue rouge.
    redCtx.fillStyle = "#000";
    redCtx.fillRect(0, 0, width, height);
    redCtx.drawImage(video, redShift, 0, width, height);

    // Vue bleue.
    blueCtx.fillStyle = "#000";
    blueCtx.fillRect(0, 0, width, height);
    blueCtx.drawImage(video, blueShift, 0, width, height);

    const redImage = redCtx.getImageData(0, 0, width, height);
    const blueImage = blueCtx.getImageData(0, 0, width, height);
    const result = ctx.createImageData(width, height);

    for (let i = 0; i < result.data.length; i += 4) {
      result.data[i]     = redImage.data[i];       // Rouge
      result.data[i + 1] = 0;                      // Pas de vert
      result.data[i + 2] = blueImage.data[i + 2];  // Bleu
      result.data[i + 3] = 255;                    // Opacité
    }

    ctx.putImageData(result, 0, 0);
  }

  function renderLoop() {
    drawFrame();

    if (!video.paused && !video.ended) {
      animationFrame = requestAnimationFrame(renderLoop);
    }
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;

    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(file);
    video.src = videoURL;
    video.load();

    playButton.disabled = true;
    exportButton.disabled = true;
    say("Chargement de la vidéo…");
  });

  video.addEventListener("loadedmetadata", () => {
    setCanvasSize();
    drawFrame();
    playButton.disabled = false;
    exportButton.disabled = false;

    say(`Vidéo prête : ${video.videoWidth} × ${video.videoHeight}.`);
  });

  video.addEventListener("loadeddata", drawFrame);
  video.addEventListener("seeked", drawFrame);

  video.addEventListener("error", () => {
    say("Impossible de lire cette vidéo. Essaie un autre fichier vidéo.");
  });

  depthRange.addEventListener("input", () => {
    depthValue.textContent = `${Number(depthRange.value).toFixed(1)} %`;
    drawFrame();
  });

  resolutionSelect.addEventListener("change", drawFrame);
  swapViews.addEventListener("change", drawFrame);

  playButton.addEventListener("click", async () => {
    try {
      if (video.paused) {
        await video.play();
        playButton.textContent = "⏸ Pause";
      } else {
        video.pause();
        playButton.textContent = "▶ Lire";
      }
    } catch (error) {
      say("La lecture n’a pas pu démarrer.");
    }
  });

  video.addEventListener("play", () => {
    cancelAnimationFrame(animationFrame);
    renderLoop();
  });

  video.addEventListener("pause", () => {
    cancelAnimationFrame(animationFrame);
    drawFrame();
    playButton.textContent = "▶ Lire";
  });

  video.addEventListener("ended", () => {
    cancelAnimationFrame(animationFrame);
    drawFrame();
    playButton.textContent = "▶ Lire";
  });

  exportButton.addEventListener("click", () => {
    if (recording || !video.videoWidth) return;

    if (!canvas.captureStream || !window.MediaRecorder) {
      say("L’enregistrement n’est pas pris en charge par ce navigateur.");
      return;
    }

    setCanvasSize();
    drawFrame();

    const fps = Number(frameRateSelect.value);
    const bitrate = Number(bitrateSelect.value);
    const stream = canvas.captureStream(fps);

    let mimeType = "";
    if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
      mimeType = "video/webm;codecs=vp9";
    } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8")) {
      mimeType = "video/webm;codecs=vp8";
    } else if (MediaRecorder.isTypeSupported("video/webm")) {
      mimeType = "video/webm";
    }

    let recorder;
    try {
      recorder = new MediaRecorder(stream, {
        ...(mimeType ? { mimeType } : {}),
        videoBitsPerSecond: bitrate
      });
    } catch (error) {
      say("Impossible de démarrer l’enregistrement sur ce navigateur.");
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    const chunks = [];
    recorder.addEventListener("dataavailable", event => {
      if (event.data && event.data.size > 0) chunks.push(event.data);
    });

    recorder.addEventListener("stop", () => {
      stream.getTracks().forEach(track => track.stop());

      if (!chunks.length) {
        say("Aucune vidéo n’a été créée.");
        return;
      }

      const blob = new Blob(chunks, { type: recorder.mimeType || "video/webm" });
      const downloadURL = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = downloadURL;
      link.download = "prisme-3d-rouge-bleu.webm";
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(downloadURL), 30000);
      recording = false;
      exportButton.disabled = false;
      exportButton.textContent = "Enregistrer la vidéo";
      say("Enregistrement terminé. La vidéo a été téléchargée.");
    });

    recording = true;
    exportButton.disabled = true;
    exportButton.textContent = "Enregistrement…";
    say("Enregistrement en cours…");

    video.currentTime = 0;
    video.play().then(() => {
      recorder.start();

      video.addEventListener("ended", () => {
        if (recorder.state !== "inactive") recorder.stop();
      }, { once: true });
    }).catch(() => {
      recording = false;
      exportButton.disabled = false;
      exportButton.textContent = "Enregistrer la vidéo";
      stream.getTracks().forEach(track => track.stop());
      say("La vidéo n’a pas pu démarrer pour l’enregistrement.");
    });
  });

  window.addEventListener("beforeunload", () => {
    cancelAnimationFrame(animationFrame);
    if (videoURL) URL.revokeObjectURL(videoURL);
  });

  drawFrame();
})();
</script>
</body>
</html>
